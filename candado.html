<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío de Código</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', 'Inter', sans-serif;
            background-color: #f4d9b0; /* Window background color */
        }
        /* Hide number spinners */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Confetti Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Main Container Card (Terracota/Brown #b36b39) -->
    <div id="main-card" class="relative w-full max-w-md bg-[#b36b39] rounded-3xl shadow-2xl p-8 md:p-12 flex flex-col items-center text-center transition-all duration-300 z-10">
        
        <!-- Instruction Text matching the window background color (#f4d9b0) -->
        <h1 id="main-title" class="text-[#f4d9b0] text-xl md:text-2xl font-bold leading-snug mb-8 tracking-wide drop-shadow-sm">
            Usando los números que conseguiste en cada juego, escribí el código correcto para ganar
        </h1>

        <!-- Interactive Content Wrapper (to be hidden on success) -->
        <div id="interactive-content" class="w-full flex flex-col items-center">
            <!-- Padlock Icon SVG -->
            <div class="mb-8 transform hover:scale-105 transition-transform duration-300">
                <svg class="w-16 h-20 md:w-20 md:h-24 drop-shadow-md" viewBox="0 0 80 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Shackle (Blue) -->
                    <path d="M20 40V28C20 15.2975 30.2975 5 43 5C55.7025 5 66 15.2975 66 28V40" stroke="#8ab4f8" stroke-width="12" stroke-linecap="round"/>
                    <!-- Body (Orange) -->
                    <rect x="10" y="40" width="60" height="50" rx="12" fill="#ffa114"/>
                    <!-- Keyhole -->
                    <circle cx="40" cy="60" r="6" fill="#6c4217"/>
                    <path d="M37 60H43V74H37V60Z" fill="#6c4217"/>
                </svg>
            </div>

            <!-- 4 Input Fields -->
            <div id="code-container" class="flex justify-center gap-3 md:gap-4 mb-8 w-full max-w-xs">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code"
                    class="code-input w-12 h-20 md:w-14 md:h-24 bg-[#6c4217] text-[#f4d9b0] text-3xl md:text-4xl font-bold text-center rounded-full focus:outline-none focus:ring-4 focus:ring-[#f4d9b0] transition-all shadow-inner caret-transparent cursor-pointer" />
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*"
                    class="code-input w-12 h-20 md:w-14 md:h-24 bg-[#6c4217] text-[#f4d9b0] text-3xl md:text-4xl font-bold text-center rounded-full focus:outline-none focus:ring-4 focus:ring-[#f4d9b0] transition-all shadow-inner caret-transparent cursor-pointer" />
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*"
                    class="code-input w-12 h-20 md:w-14 md:h-24 bg-[#6c4217] text-[#f4d9b0] text-3xl md:text-4xl font-bold text-center rounded-full focus:outline-none focus:ring-4 focus:ring-[#f4d9b0] transition-all shadow-inner caret-transparent cursor-pointer" />
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*"
                    class="code-input w-12 h-20 md:w-14 md:h-24 bg-[#6c4217] text-[#f4d9b0] text-3xl md:text-4xl font-bold text-center rounded-full focus:outline-none focus:ring-4 focus:ring-[#f4d9b0] transition-all shadow-inner caret-transparent cursor-pointer" />
            </div>

            <!-- Accept Button (Background color: #f4d9b0, Text color: #b36b39) -->
            <button id="accept-btn" onclick="validateCode()" class="w-full max-w-xs py-3.5 px-6 bg-[#f4d9b0] text-[#b36b39] font-bold text-lg md:text-xl rounded-2xl shadow-lg hover:bg-white active:scale-95 transition-all duration-200">
                Aceptar
            </button>
        </div>

        <!-- Success Message Area (Hidden by default) -->
        <div id="success-container" class="hidden flex-col items-center justify-center py-6 w-full animate-fade-in">
            <div class="text-6xl md:text-7xl mb-4 animate-bounce">🎉</div>
            <h2 id="success-msg" class="text-[#f4d9b0] text-2xl md:text-3xl font-extrabold tracking-wide drop-shadow-md">
                ¡Bien hecho ganaste!
            </h2>
        </div>

        <!-- Error Message Feedback -->
        <div id="message-container" class="h-8 flex items-center justify-center mt-4">
            <p id="feedback-msg" class="text-amber-100 text-sm md:text-base font-semibold opacity-0 transition-opacity duration-300"></p>
        </div>

    </div>

    <!-- JavaScript Logic & Confetti Engine -->
    <script>
        const CORRECT_CODE = "5787";
        const inputs = document.querySelectorAll('.code-input');
        const feedbackMsg = document.getElementById('feedback-msg');
        const interactiveContent = document.getElementById('interactive-content');
        const mainTitle = document.getElementById('main-title');
        const successContainer = document.getElementById('success-container');
        const messageContainer = document.getElementById('message-container');

        // Handle auto-focus and input navigation
        inputs.forEach((input, index) => {
            if (index === 0) {
                setTimeout(() => input.focus(), 100);
            }

            input.addEventListener('input', (e) => {
                const digit = e.target.value.replace(/[^0-9]/g, '').slice(-1);
                e.target.value = digit;

                if (digit && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                feedbackMsg.classList.add('opacity-0');
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') {
                    if (input.value === '' && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = '';
                    } else {
                        input.value = '';
                    }
                    feedbackMsg.classList.add('opacity-0');
                    e.preventDefault();
                } else if (e.key === 'ArrowLeft' && index > 0) {
                    inputs[index - 1].focus();
                } else if (e.key === 'ArrowRight' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                } else if (e.key === 'Enter') {
                    validateCode();
                }
            });

            input.addEventListener('focus', () => input.select());
        });

        function validateCode() {
            let currentCode = "";
            inputs.forEach(input => {
                currentCode += input.value;
            });

            if (currentCode.length < 4) {
                feedbackMsg.textContent = "Completá todos los números";
                feedbackMsg.classList.remove('opacity-0');
                return;
            }

            if (currentCode === CORRECT_CODE) {
                // Hide title, interactive elements, and feedback area completely
                mainTitle.style.display = 'none';
                interactiveContent.style.display = 'none';
                messageContainer.style.display = 'none';
                
                // Show success message container
                successContainer.classList.remove('hidden');
                successContainer.classList.add('flex');

                // Trigger Confetti Effect
                startConfetti();
            } else {
                feedbackMsg.textContent = "Código incorrecto, ¡intentá de nuevo!";
                feedbackMsg.classList.remove('opacity-0');
                
                // Shake animation on error
                const container = document.getElementById('code-container');
                container.classList.add('animate-pulse');
                setTimeout(() => container.classList.remove('animate-pulse'), 500);
            }
        }

        /* Confetti Animation Script */
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startConfetti() {
            particles = [];
            const colors = ['#b36b39', '#ffa114', '#8ab4f8', '#ffffff', '#eab308', '#22c55e', '#ec4899'];
            
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 1) * 16 - 4,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 10,
                    gravity: 0.35,
                    opacity: 1
                });
            }

            if (!animationId) {
                loopConfetti();
            }
        }

        function loopConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.rotation += p.rotationSpeed;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                ctx.restore();

                if (p.y > canvas.height + 50) {
                    particles.splice(index, 1);
                }
            });

            if (particles.length > 0) {
                animationId = requestAnimationFrame(loopConfetti);
            } else {
                animationId = null;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
    </script>
</body>
</html>
